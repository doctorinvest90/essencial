<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Diagnóstico — Doctor Invest</title>
<!--
  Redirect da Aproximação, coorte "mudo (nunca respondeu — PERDIDO por decay + TENTATIVA sem resposta)".

  Existe para o link do WhatsApp ser curto e não contar nada sobre quem o recebe.
  A versão anterior mandava "?utm_source=crm-<coorte>" na mensagem, ou seja,
  dizia ao destinatário que ele está catalogado num CRM. A letra é opaca, e o
  utm que sai daqui também ("crm-b"): nem a barra do navegador, depois do
  clique, revela a segmentação. O mapeamento letra→coorte vive em
  src/sofia/aproximacao/message.ts (PATH_DO_COORTE) no repo twenty-followup-sync.

  noindex porque é página de máquina, não de gente — não deve entrar em busca.
-->
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://essencial.drheliobarros.com.br/">
<meta http-equiv="refresh" content="0; url=/?utm_source=crm-b&utm_campaign=aproximacao-2026">
<script>
  // replace() e não href: sem entrada no histórico, então o "voltar" do quiz
  // não cai neste redirect e reenvia a pessoa para frente num laço.
  location.replace("/?utm_source=crm-b&utm_campaign=aproximacao-2026");
</script>
<style>
  body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0D1B2A; color: #F2EFE7; padding: 2rem; text-align: center; }
  a { color: #C9A84C; }
</style>
</head>
<body>
  <p>Abrindo o seu diagnóstico…<br>
    <a href="/?utm_source=crm-b&utm_campaign=aproximacao-2026">Toque aqui se não abrir sozinho.</a>
  </p>
</body>
</html>
